[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-env"
version = "0.1.0"
description = "Forge — self-improving playbook OpenEnv environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openenv-core>=0.1.0",
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "matplotlib>=3.8.0", "gradio>=4.40.0", "tiktoken>=0.7.0"]
train = [
  "trl>=0.10.0",
  "transformers>=4.44.0",
  "accelerate>=0.33.0",
  "huggingface_hub>=0.24.0",
  "bitsandbytes>=0.43.0",
  "tiktoken>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["forge_env"]
